name: Windows portable preview

on:
  pull_request:
    paths:
      - '.github/workflows/windows-package.yml'
      - 'packaging/windows/**'
      - 'scripts/package_windows.py'
      - 'src/**'
      - 'examples/moon-heist.planacity.json'
      - 'LICENSE'
      - 'pyproject.toml'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-windows-preview:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev,deploy]"
      - name: Build from an MSVC x64 environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "Visual Studio C++ tools were not found." }
          $developerShell = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          $python = Join-Path $env:pythonLocation "python.exe"
          cmd.exe /d /s /c "`"$developerShell`" -arch=x64 -host_arch=x64 && `"$python`" scripts\package_windows.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate packaged files
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\windows\Planacity-*-windows-x64.zip -File
          $checksum = Get-ChildItem dist\windows\Planacity-*-windows-x64.zip.sha256 -File
          if ($zip.Count -ne 1 -or $checksum.Count -ne 1) {
            throw "Expected one Windows ZIP and one checksum."
          }
      - uses: actions/upload-artifact@v7
        with:
          name: planacity-windows-preview
          path: |
            dist/windows/*.zip
            dist/windows/*.sha256
          if-no-files-found: error
          retention-days: 14

  attach-to-approved-release:
    if: github.event_name == 'release' && github.event.release.prerelease
    needs: build-windows-preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: planacity-windows-preview
          path: artifacts
      - name: Require a matching development preview tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          asset=$(find artifacts -type f -name 'Planacity-*-windows-x64.zip' -printf '%f\n')
          expected="Planacity-${RELEASE_TAG}-windows-x64.zip"
          test "$asset" = "$expected"
      - name: Attach Windows preview and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/*.zip artifacts/*.sha256 --repo "${{ github.repository }}"

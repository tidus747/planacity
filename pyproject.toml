[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "planacity"
version = "0.3.0"
description = "Open-source program planning for engineering teams"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "mypy>=1.15,<2", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.gui-scripts]
planacity = "planacity.main:main"

[project.urls]
Repository = "https://github.com/tidus747/planacity"
Issues = "https://github.com/tidus747/planacity/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planacity = ["resources/icons/*", "resources/images/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
